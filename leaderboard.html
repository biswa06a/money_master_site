<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="monetag" content="c2185f0f954c073056658902a99539ea" />
  <title>Leaderboard - Money Master</title>
  <link rel="stylesheet" href="leaderboard.css" />
  <link rel="icon" href="assets/money_master_favicon.png" />
</head>
<body onload="loadLeaderboard()">

  <!-- Top Ad -->
  <div class="ad-banner top-banner">[ Top Banner Ad ]</div>

  <!-- Back Icon -->
  <img src="assets/icon_nevigation.png" class="nav-icon" onclick="goBack()" alt="Back" tabindex="-1" />

  <div class="leaderboard-container">
    <img src="assets/icon_leaderboard.png" class="leader-icon" alt="Leaderboard" />
    <h2 class="glow-title">Top Earners</h2>

    <div id="leaderList" class="leader-list">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- Bottom Ad -->
  <div class="ad-banner bottom-banner">[ Bottom Banner Ad ]</div>

  <!-- Firebase Auth Check -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDo6BwWCRTexL_-lUwgy41FYB3zpJKRiWU",
      authDomain: "money-master-89c02.firebaseapp.com",
      projectId: "money-master-89c02",
      storageBucket: "money-master-89c02.appspot.com",
      messagingSenderId: "226410161274",
      appId: "1:226410161274:web:62793ff8d39e0d642707c3",
      measurementId: "G-62K0SFSZK4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    function goBack() {
      const sound = new Audio("assets/sound.mp3");
      sound.play();
      window.location.href = "dashboard.html";
    }
  </script>

  <script src="leaderboard.js"></script>
</body>
</html>
