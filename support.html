<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="monetag" content="c2185f0f954c073056658902a99539ea" />
  <title>Support - Money Master</title>
  <link rel="stylesheet" href="support.css" />
  <link rel="icon" href="assets/money_master_favicon.png" />

  <!-- Disable outline (click glow) -->
  <style>
    *:focus {
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Top Ad -->
  <div class="ad-banner top-banner">[ Top Banner Ad ]</div>

  <!-- Back Icon -->
  <img src="assets/icon_nevigation.png" class="nav-icon" onclick="goBack()" alt="Back" />

  <div class="support-container">
    <img src="assets/icon_support.png" class="support-icon" alt="Support" />

    <h2 class="section-title">Need Help?</h2>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" placeholder="Enter your issue subject" />
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Describe your issue..."></textarea>
    </div>

    <button class="send-btn" onclick="sendSupport()">Send Message</button>
  </div>

  <!-- Bottom Ad -->
  <div class="ad-banner bottom-banner">[ Bottom Banner Ad ]</div>

  <!-- Firebase Auth Check -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.11/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.11/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDo6BwWCRTexL_-lUwgy41FYB3zpJKRiWU",
      authDomain: "money-master-89c02.firebaseapp.com",
      projectId: "money-master-89c02",
      storageBucket: "money-master-89c02.appspot.com",
      messagingSenderId: "226410161274",
      appId: "1:226410161274:web:62793ff8d39e0d642707c3",
      measurementId: "G-62K0SFSZK4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });
  </script>

  <!-- SW Register -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    function goBack() {
      const s = new Audio("assets/sound.mp3");
      s.play();
      window.location.href = "dashboard.html";
    }
  </script>

  <!-- Support Logic -->
  <script src="support.js"></script>
</body>
</html>
